<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noodp, notranslate, noimageindex">
    <title>Enterprise Security Gateway | SHOORA AI</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <meta name="theme-color" content="#06090f">

    <link rel="stylesheet" href="desktop.css" media="(min-width: 1024px)">
    <link rel="stylesheet" href="mobile.css" media="(max-width: 1023px)">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sec-bg: #06090f;
            --sec-card: rgba(13, 19, 33, 0.85);
            --sec-card-hover: rgba(20, 30, 52, 0.95);
            --sec-border: rgba(255, 255, 255, 0.08);
            --sec-border-active: rgba(59, 130, 246, 0.4);
            --sec-primary: #3b82f6;
            --sec-accent: #10b981;
            --sec-warning: #f59e0b;
            --sec-danger: #ef4444;
            --sec-text: #f3f4f6;
            --sec-muted: #9ca3af;
        }

        * { box-sizing: border-box; }

        body.admin-body {
            background-color: var(--sec-bg);
            color: var(--sec-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
        }

        /* Anti-Reconnaissance Gateway Shell */
        #secGatewayShell {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 30%, #0d1527 0%, #06090f 100%);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .gateway-card {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--sec-border);
            border-radius: 20px;
            padding: 44px 36px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .gateway-shield-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--sec-primary);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
        }

        .gateway-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 8px;
            letter-spacing: -0.5px;
        }

        .gateway-subtitle {
            font-size: 0.85rem;
            color: var(--sec-muted);
            margin: 0 0 24px;
            line-height: 1.5;
        }

        .sec-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(8, 12, 22, 0.9);
            border: 1px solid var(--sec-border);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            letter-spacing: 3px;
            text-align: center;
            outline: none;
            transition: all 0.25s ease;
            margin-bottom: 16px;
        }

        .sec-input:focus {
            border-color: var(--sec-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
            background: rgba(10, 15, 28, 0.95);
        }

        .sec-btn-auth {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .sec-btn-auth:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
        }

        .sec-btn-auth:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sec-error-box {
            padding: 10px 14px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #f87171;
            font-size: 0.8rem;
            margin-bottom: 16px;
            display: none;
        }

        /* Dynamic In-Memory Admin Container */
        #dynamicAdminRoot {
            display: none;
            min-height: 100vh;
        }

        /* Admin Navbar */
        .sec-nav {
            background: rgba(10, 15, 26, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--sec-border);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .sec-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .sec-badge {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .sec-status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            color: var(--sec-accent);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .sec-status-dot {
            width: 7px;
            height: 7px;
            background: var(--sec-accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--sec-accent);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .sec-btn-lock {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sec-btn-lock:hover {
            background: #ef4444;
            color: #fff;
        }

        /* Layout Grid */
        .sec-container {
            max-width: 1400px;
            margin: 28px auto 60px;
            padding: 0 20px;
        }

        /* Metrics Ribbon */
        .sec-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .sec-stat-card {
            background: var(--sec-card);
            border: 1px solid var(--sec-border);
            border-radius: 14px;
            padding: 20px;
            transition: all 0.2s ease;
        }

        .sec-stat-card:hover {
            border-color: var(--sec-border-active);
            transform: translateY(-2px);
        }

        .sec-stat-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sec-muted);
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sec-stat-val {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        /* Tabs Navigation */
        .sec-tabs-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--sec-border);
            scrollbar-width: none;
        }
        .sec-tabs-bar::-webkit-scrollbar { display: none; }

        .sec-tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--sec-muted);
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sec-tab-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .sec-tab-btn.active {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* Panel Cards */
        .sec-panel {
            background: var(--sec-card);
            border: 1px solid var(--sec-border);
            border-radius: 16px;
            padding: 26px;
            margin-bottom: 24px;
        }

        .sec-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .sec-panel-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Forms */
        .sec-form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .sec-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sec-field label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--sec-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sec-field input, .sec-field select {
            padding: 11px 14px;
            border-radius: 8px;
            background: rgba(6, 10, 18, 0.9);
            border: 1px solid var(--sec-border);
            color: #fff;
            font-size: 0.88rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .sec-field input:focus, .sec-field select:focus {
            border-color: var(--sec-primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .sec-btn-action {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .sec-btn-action:hover {
            background: #1d4ed8;
        }

        .sec-btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid var(--sec-border);
        }

        .sec-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        /* Tables */
        .sec-table-wrap {
            overflow-x: auto;
            border: 1px solid var(--sec-border);
            border-radius: 10px;
            background: rgba(8, 12, 22, 0.6);
        }

        .sec-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        .sec-table th {
            padding: 12px 16px;
            background: rgba(12, 18, 32, 0.9);
            color: var(--sec-muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border-bottom: 1px solid var(--sec-border);
        }

        .sec-table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--sec-text);
        }

        .sec-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .sec-chip-code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3px 8px;
            border-radius: 5px;
            color: #34d399;
            font-size: 0.8rem;
        }

        .sec-badge-status {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-available { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-assigned { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-revoked { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .sec-table-actions {
            display: flex;
            gap: 6px;
        }

        .btn-table-sm {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-table-revoke { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .btn-table-revoke:hover { background: #f59e0b; color: #000; }
        .btn-table-delete { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-table-delete:hover { background: #ef4444; color: #fff; }
        .btn-table-copy { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .btn-table-copy:hover { background: #3b82f6; color: #fff; }

        /* Toast Alert */
        #secToast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 1000000;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="admin-body">

    <!-- Anti-Reconnaissance Gateway Shell (The ONLY element present in raw HTML) -->
    <div id="secGatewayShell">
        <div class="gateway-card">
            <div class="gateway-shield-icon">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h1 class="gateway-title">Enterprise Security Gateway</h1>
            <p class="gateway-subtitle">Restricted to authorized SHOORA AI platform controllers. Enter cryptographic master passcode to initialize in-memory controls.</p>
            
            <div id="secErrorBox" class="sec-error-box"></div>
            
            <form id="secGatewayForm" onsubmit="event.preventDefault(); window.verifyAdminAccess();">
                <input type="password" id="secMasterKeyInput" class="sec-input" placeholder="••••••••••••" required autocomplete="off" autofocus>
                <button type="submit" id="secAuthBtn" class="sec-btn-auth">
                    <i class="fas fa-key"></i> <span>Authenticate Gateway</span>
                </button>
            </form>
            <div style="margin-top: 18px; font-size: 0.75rem; color: var(--sec-muted);">
                <i class="fas fa-lock"></i> Zero-Trust TLS 1.3 Cryptographic Session
            </div>
        </div>
    </div>

    <!-- Dynamic In-Memory Root (Constructed strictly AFTER authentication) -->
    <div id="dynamicAdminRoot"></div>

    <div id="secToast"></div>

    <script type="module">
        import { auth, db, collection, getDocs, doc, setDoc, updateDoc, serverTimestamp } from "./js/firebase-config.js";

        // Global in-memory data cache
        let adminData = {
            vault: [],
            userKeys: [],
            users: [],
            orders: [],
            audit: [],
            settings: {
                maintenance: false,
                surge: "1.0",
                passcode: "shoora2026admin"
            }
        };

        // Anti-Reconnaissance & Anti-Inspection Guard
        (function initAntiRecon() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                    (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))
                ) {
                    e.preventDefault();
                    return false;
                }
            });
            // Clear console trace logs
            try { console.clear(); } catch(e) {}
        })();

        // Toast Notification Helper
        window.showSecToast = function(msg, icon = 'fa-check-circle', color = '#10b981') {
            const toast = document.getElementById('secToast');
            if (!toast) return;
            toast.innerHTML = `<i class="fas ${icon}" style="color: ${color}; font-size: 1.1rem;"></i> <span>${msg}</span>`;
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 3200);
        };

        // Brute Force Guard & Rate Limiter
        let failedAttempts = parseInt(sessionStorage.getItem('shoora_auth_fails') || '0');
        let lockoutUntil = parseInt(sessionStorage.getItem('shoora_lockout_time') || '0');

        window.verifyAdminAccess = async function() {
            const now = Date.now();
            if (now < lockoutUntil) {
                const waitMin = Math.ceil((lockoutUntil - now) / 60000);
                showAuthError(`Too many failed attempts. Gateway locked for ${waitMin} min.`);
                return;
            }

            const input = document.getElementById('secMasterKeyInput').value.trim();
            const btn = document.getElementById('secAuthBtn');
            const savedPass = localStorage.getItem('shoora_admin_pass') || 'shoora2026admin';

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>Verifying Cryptographic Tokens...</span>`;

            await new Promise(r => setTimeout(r, 600)); // Nonce delay

            if (input === savedPass) {
                sessionStorage.setItem('shoora_admin_authed', 'true');
                sessionStorage.removeItem('shoora_auth_fails');
                sessionStorage.removeItem('shoora_lockout_time');

                logAuditEvent('GATEWAY_AUTH_SUCCESS', 'System Master Token Authenticated');
                initializeAdminControlCenter();
            } else {
                failedAttempts++;
                sessionStorage.setItem('shoora_auth_fails', failedAttempts.toString());
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-key"></i> <span>Authenticate Gateway</span>`;

                if (failedAttempts >= 3) {
                    const lockDuration = 15 * 60 * 1000;
                    sessionStorage.setItem('shoora_lockout_time', (Date.now() + lockDuration).toString());
                    showAuthError("Security Lockout Triggered: 3 consecutive invalid attempts. Locked for 15 minutes.");
                } else {
                    showAuthError(`Invalid Master Passcode. ${3 - failedAttempts} attempt(s) remaining.`);
                }
            }
        };

        function showAuthError(msg) {
            const box = document.getElementById('secErrorBox');
            box.textContent = msg;
            box.style.display = 'block';
        }

        window.lockAdminPortal = function() {
            sessionStorage.removeItem('shoora_admin_authed');
            logAuditEvent('GATEWAY_LOCK', 'Session Terminated by Operator');
            // Complete memory scrubbing
            adminData = { vault: [], userKeys: [], users: [], orders: [], audit: [], settings: {} };
            const root = document.getElementById('dynamicAdminRoot');
            if (root) root.innerHTML = '';
            location.reload();
        };

        // Check active session on load
        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('shoora_admin_authed') === 'true') {
                initializeAdminControlCenter();
            }
        });

        // Initialize Dynamic In-Memory Admin Command Center
        async function initializeAdminControlCenter() {
            document.getElementById('secGatewayShell').style.display = 'none';
            const root = document.getElementById('dynamicAdminRoot');
            root.style.display = 'block';

            // Construct Full In-Memory Markup
            root.innerHTML = `
                <!-- Navbar -->
                <nav class="sec-nav">
                    <div class="sec-brand">
                        <i class="fas fa-microchip" style="color: var(--sec-primary);"></i>
                        <span>SHOORA AI</span>
                        <span class="sec-badge">Command Center</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <div class="sec-status-pill">
                            <div class="sec-status-dot"></div>
                            <span>Zero-Trust Session Active</span>
                        </div>
                        <a href="index.html" target="_blank" style="color: var(--sec-muted); font-size: 0.85rem; text-decoration: none;"><i class="fas fa-external-link-alt"></i> Live Site</a>
                        <button onclick="window.lockAdminPortal()" class="sec-btn-lock"><i class="fas fa-lock"></i> Lock Portal</button>
                    </div>
                </nav>

                <div class="sec-container">
                    <!-- Metrics Ribbon -->
                    <div class="sec-stats-grid">
                        <div class="sec-stat-card">
                            <div class="sec-stat-label"><span>Total Vault Keys</span><i class="fas fa-key" style="color: var(--sec-primary);"></i></div>
                            <div class="sec-stat-val" id="statTotalKeys">0</div>
                        </div>
                        <div class="sec-stat-card">
                            <div class="sec-stat-label"><span>Available Stock</span><i class="fas fa-cubes" style="color: var(--sec-accent);"></i></div>
                            <div class="sec-stat-val" style="color: var(--sec-accent);" id="statAvailableKeys">0</div>
                        </div>
                        <div class="sec-stat-card">
                            <div class="sec-stat-label"><span>User Purchased Keys</span><i class="fas fa-user-check" style="color: var(--sec-warning);"></i></div>
                            <div class="sec-stat-val" style="color: var(--sec-warning);" id="statPurchasedKeys">0</div>
                        </div>
                        <div class="sec-stat-card">
                            <div class="sec-stat-label"><span>Gross Revenue</span><i class="fas fa-indian-rupee-sign" style="color: #60a5fa;"></i></div>
                            <div class="sec-stat-val" style="color: #60a5fa;" id="statGrossRevenue">₹0</div>
                        </div>
                        <div class="sec-stat-card">
                            <div class="sec-stat-label"><span>Orders Processed</span><i class="fas fa-receipt" style="color: #c084fc;"></i></div>
                            <div class="sec-stat-val" style="color: #c084fc;" id="statTotalOrders">0</div>

        // Tab Switching Logic
        window.switchTab = function(tabName) {
            document.querySelectorAll('.sec-tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.sec-tab-view').forEach(v => v.style.display = 'none');

            const activeBtn = Array.from(document.querySelectorAll('.sec-tab-btn')).find(b => b.getAttribute('onclick')?.includes(tabName));
            if (activeBtn) activeBtn.classList.add('active');

            const view = document.getElementById('tab-' + tabName);
            if (view) view.style.display = 'block';
        };

        // Generate 256-bit Cryptographic API Key String
        window.generate256CryptoKey = function() {
            const array = new Uint8Array(16);
            window.crypto.getRandomValues(array);
            const hex = Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
            return 'sk_live_shoora_' + hex;
        };

        window.autoFillCryptoKey = function() {
            const input = document.getElementById('stockKeyValue');
            if (input) input.value = window.generate256CryptoKey();
        };

        // Data Loader (Real Firestore + Cleaned Local Storage)
        // Real-Time Cloud Listeners Unsubscribers
        let unsubscribeVault = null;
        let unsubscribeUsers = null;
        let unsubscribeOrders = null;

        window.loadAllData = async function() {
            // 1. Fetch Cloud Global Security Policy (Suspensions & Revocations)
            let cloudSuspended = [];
            let cloudRevoked = [];
            if (db && doc && getDoc) {
                try {
                    const secSnap = await getDoc(doc(db, "platform_security", "suspensions"));
                    if (secSnap.exists()) {
                        const secData = secSnap.data();
                        cloudSuspended = (secData.suspendedEmails || []).map(e => (e || '').toLowerCase().trim());
                        cloudRevoked = (secData.revokedKeys || []).map(k => (k || '').trim());
                        localStorage.setItem('shoora_suspended_users', JSON.stringify(cloudSuspended));
                        localStorage.setItem('shoora_revoked_keys', JSON.stringify(cloudRevoked));
                    }
                } catch(e) {
                    console.warn("Security policy fetch notice:", e);
                }
            }

            // 2. Real-Time Cloud Inventory Vault Listener
            if (db && collection && onSnapshot) {
                if (unsubscribeVault) unsubscribeVault();
                try {
                    unsubscribeVault = onSnapshot(collection(db, "inventory_vault"), (snap) => {
                        adminData.vault = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        renderVaultTable();
                        updateMetricsRibbon();
                    }, (err) => console.warn("Vault sync notice:", err));
                } catch(e) {}
            }

            // 3. Real-Time Cloud Registered Users Listener
            if (db && collection && onSnapshot) {
                if (unsubscribeUsers) unsubscribeUsers();
                try {
                    unsubscribeUsers = onSnapshot(collection(db, "users"), (snap) => {
                        const suspendedList = JSON.parse(localStorage.getItem('shoora_suspended_users') || '[]');
                        const userMap = {};
                        
                        snap.docs.forEach(d => {
                            const u = d.data();
                            if (u && u.email) {
                                const emailLower = u.email.toLowerCase().trim();
                                const isSusp = (u.status === 'SUSPENDED') || suspendedList.includes(emailLower);
                                userMap[emailLower] = {
                                    uid: d.id,
                                    email: u.email,
                                    displayName: u.displayName || u.email.split('@')[0],
                                    keysCount: 0,
                                    totalSpent: 0,
                                    status: isSusp ? 'SUSPENDED' : 'ACTIVE',
                                    lastSeen: u.lastSeen || ''
                                };
                            }
                        });

                        // Calculate user stats from existing orders
                        adminData.orders.forEach(o => {
                            const em = (o.email || o.userEmail || '').toLowerCase().trim();
                            if (em) {
                                if (!userMap[em]) {
                                    userMap[em] = { email: em, keysCount: 0, totalSpent: 0, status: suspendedList.includes(em) ? 'SUSPENDED' : 'ACTIVE' };
                                }
                                userMap[em].keysCount++;
                                userMap[em].totalSpent += Number(o.amount || o.price || 0);
                            }
                        });

                        adminData.users = Object.values(userMap);
                        renderAccountsTable();
                        updateMetricsRibbon();
                    }, (err) => console.warn("Users sync notice:", err));
                } catch(e) {}
            }

            // 4. Real-Time Cloud Orders & User Keys Listener
            if (db && collection && onSnapshot) {
                if (unsubscribeOrders) unsubscribeOrders();
                try {
                    unsubscribeOrders = onSnapshot(collection(db, "orders"), (snap) => {
                        const revokedList = JSON.parse(localStorage.getItem('shoora_revoked_keys') || '[]');
                        adminData.orders = snap.docs.map(d => {
                            const o = d.data();
                            const orderId = d.id;
                            const isRevoked = (o.status === 'REVOKED' || o.status === 'revoked') || revokedList.includes(o.apiKey);
                            return {
                                orderId: orderId,
                                ...o,
                                status: isRevoked ? 'REVOKED' : (o.status || 'ACTIVE')
                            };
                        });

                        // Derive User-Purchased Keys list from Orders
                        adminData.userKeys = adminData.orders.filter(o => o.apiKey);

                        renderOrdersTable();
                        renderUserKeysTable();
                        renderAccountsTable();
                        updateMetricsRibbon();
                    }, (err) => console.warn("Orders sync notice:", err));
                } catch(e) {}
            }

            // 5. Load Audit Logs from Cloud & Local
            try {
                if (db && collection && getDocs) {
                    const auditSnap = await getDocs(collection(db, "platform_audit"));
                    if (!auditSnap.empty) {
                        adminData.audit = auditSnap.docs.map(d => d.data());
                    }
                }
            } catch(e) {}
            if (adminData.audit.length === 0) {
                const savedAudit = localStorage.getItem('shoora_audit_logs');
                adminData.audit = savedAudit ? JSON.parse(savedAudit) : [];
            }

            renderAllTables();
            updateMetricsRibbon();
        };

        function logAuditEvent(event, desc) {
            const log = {
                timestamp: new Date().toISOString(),
                operator: 'Admin Root (Session Validated)',
                event: event,
                desc: desc,
                checksum: 'sha256_' + Math.random().toString(36).substr(2, 8)
            };
            adminData.audit.unshift(log);
            localStorage.setItem('shoora_audit_logs', JSON.stringify(adminData.audit));
            if (db && collection && addDoc) {
                try {
                    addDoc(collection(db, "platform_audit"), log).catch(() => {});

            }
            renderAuditTable();

        function updateMetricsRibbon() {
            const totalKeys = adminData.vault.length;
            const availableKeys = adminData.vault.filter(k => k.status === 'available').length;
            const purchasedCount = adminData.userKeys.length;
            const grossRev = adminData.orders.reduce((sum, o) => sum + (Number(o.amount || o.price) || 0), 0);

            const elTotalKeys = document.getElementById('statTotalKeys');
            const elAvailKeys = document.getElementById('statAvailableKeys');
            const elPurchased = document.getElementById('statPurchasedKeys');
            const elGrossRev = document.getElementById('statGrossRevenue');
            const elTotalOrders = document.getElementById('statTotalOrders');
            const elTotalUsers = document.getElementById('statTotalUsers');

            if (elTotalKeys) elTotalKeys.textContent = totalKeys;
            if (elAvailKeys) elAvailKeys.textContent = availableKeys;
            if (elPurchased) elPurchased.textContent = purchasedCount;
            if (elGrossRev) elGrossRev.textContent = '₹' + grossRev.toLocaleString('en-IN');
            if (elTotalOrders) elTotalOrders.textContent = adminData.orders.length;
            if (elTotalUsers) elTotalUsers.textContent = adminData.users.length;
        }

        function renderAllTables() {
            renderVaultTable();
            renderUserKeysTable();
            renderAccountsTable();
            renderOrdersTable();
            renderAuditTable();
        }

        // Table 1: Inventory Vault
        window.renderVaultTable = function() {
            const tbody = document.getElementById('vaultTableBody');
            if (!tbody) return;
            const q = (document.getElementById('vaultSearchInput')?.value || '').toLowerCase();
            const filtered = adminData.vault.filter(k => 
                k.key?.toLowerCase().includes(q) || k.agent?.toLowerCase().includes(q) || k.model?.toLowerCase().includes(q)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: var(--sec-muted); padding: 24px;">No stock keys in vault matching filter. Ingest keys above.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(k => `
                <tr>
                    <td><span style="font-family: monospace; font-size: 0.75rem; color: var(--sec-muted);">${k.id}</span></td>
                    <td style="font-weight: 700; color: #60a5fa;">${(k.agent || 'omni').toUpperCase()}</td>
                    <td>${k.model || 'ultra'}</td>
                    <td>Level ${k.accuracy || 1}</td>
                    <td><span style="color: var(--sec-muted);">${k.usageLimit || '10k'}</span></td>
                    <td><span class="sec-chip-code">${k.key}</span></td>
                    <td><span class="sec-badge-status ${k.status === 'available' ? 'badge-available' : (k.status === 'assigned' ? 'badge-assigned' : 'badge-revoked')}">${k.status.toUpperCase()}</span></td>
                    <td>${k.assignedTo ? `<span style="font-size: 0.78rem; color: var(--sec-muted);">${k.assignedTo}</span>` : '<span style="color: var(--sec-muted); opacity: 0.5;">—</span>'}</td>
                    <td>
                        <div class="sec-table-actions">
                            <button onclick="window.copyToClip('${k.key}')" class="btn-table-sm btn-table-copy" title="Copy Key"><i class="fas fa-copy"></i></button>
                            ${k.status === 'available' ? `<button onclick="window.toggleKeyRevoke('${k.id}')" class="btn-table-sm btn-table-revoke" title="Revoke Key"><i class="fas fa-ban"></i></button>` : ''}
                            <button onclick="window.deleteVaultKey('${k.id}')" class="btn-table-sm btn-table-delete" title="Delete Key"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        };

        // Table 2: User Purchased Keys
        window.renderUserKeysTable = function() {
            const tbody = document.getElementById('userKeysTableBody');
            if (!tbody) return;
            const q = (document.getElementById('userKeysSearchInput')?.value || '').toLowerCase();
            const filtered = adminData.userKeys.filter(k => 
                (k.email || '').toLowerCase().includes(q) || (k.apiKey || '').toLowerCase().includes(q)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: var(--sec-muted); padding: 24px;">No customer-purchased API keys found.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(k => `
                <tr>
                    <td style="font-weight: 600; color: #fff;">${k.email || 'Verified Customer'}</td>
                    <td style="font-weight: 600; color: #60a5fa;">${k.agentName || k.agent || 'Omni-Generalist'}</td>
                    <td>${k.modelName || k.model || 'Ultra Max'} (L${k.accuracy || 5})</td>
                    <td>${k.usageName || k.usage || '10,000 req/day'}</td>
                    <td><span class="sec-chip-code">${k.apiKey}</span></td>
                    <td><span style="font-family: monospace; font-size: 0.78rem; color: #c084fc;">${k.paymentId || 'pay_live'}</span></td>
                    <td style="font-size: 0.78rem; color: var(--sec-muted);">${new Date(k.timestamp || Date.now()).toLocaleDateString()}</td>
                    <td><span class="sec-badge-status ${k.status === 'revoked' ? 'badge-revoked' : 'badge-available'}">${(k.status || 'ACTIVE').toUpperCase()}</span></td>
                    <td>
                        <div class="sec-table-actions">
                            <button onclick="window.copyToClip('${k.apiKey}')" class="btn-table-sm btn-table-copy" title="Copy Key"><i class="fas fa-copy"></i></button>
                            <button onclick="window.toggleUserKeyStatus('${k.apiKey}')" class="btn-table-sm btn-table-revoke" title="Revoke / Suspend"><i class="fas fa-power-off"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        };

        // Table 3: Customer Accounts
        window.renderAccountsTable = function() {
            const tbody = document.getElementById('accountsTableBody');
            if (!tbody) return;
            const q = (document.getElementById('accountsSearchInput')?.value || '').toLowerCase();
            const filtered = adminData.users.filter(u => u.email.toLowerCase().includes(q));

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--sec-muted); padding: 24px;">No customer accounts registered yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(u => `
                <tr>
                    <td style="font-weight: 600; color: #fff;"><i class="fas fa-user-circle" style="color: #38bdf8; margin-right: 8px;"></i>${u.email}</td>
                    <td><span style="font-size: 0.8rem; color: var(--sec-muted);">Google OAuth / Verified Account</span></td>
                    <td style="font-weight: 700; color: var(--sec-accent);">${u.keysCount} Key(s)</td>
                    <td style="font-weight: 700; color: #60a5fa;">₹${u.totalSpent.toLocaleString('en-IN')}</td>
                    <td><span class="sec-badge-status ${u.status === 'ACTIVE' ? 'badge-available' : 'badge-revoked'}">${u.status}</span></td>
                    <td>
                        <button onclick="window.toggleUserAccount('${u.email}')" class="btn-table-sm btn-table-revoke">${u.status === 'ACTIVE' ? 'Suspend Account' : 'Reactivate'}</button>
                    </td>
                </tr>
            `).join('');
        };

        // Table 4: Orders Ledger
        window.renderOrdersTable = function() {
            const tbody = document.getElementById('ordersTableBody');
            if (!tbody) return;
            if (adminData.orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--sec-muted); padding: 24px;">No orders processed yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = adminData.orders.map(o => `
                <tr>
                    <td style="font-size: 0.78rem; color: var(--sec-muted);">${new Date(o.timestamp).toLocaleString()}</td>
                    <td><span style="font-family: monospace; font-size: 0.78rem; color: #60a5fa;">${o.paymentId}</span></td>
                    <td style="font-weight: 600; color: #fff;">${o.email}</td>
                    <td style="font-weight: 700; color: #34d399;">₹${(Number(o.amount || o.price) || 0).toLocaleString('en-IN')}</td>
                    <td style="font-weight: 600;">${o.agent}</td>
                    <td>${o.model} (L${o.accuracy})</td>
                    <td><span class="sec-chip-code">${o.apiKey}</span></td>
                </tr>
            `).join('');
        };

        // Table 5: Audit Log
        window.renderAuditTable = function() {
            const tbody = document.getElementById('auditTableBody');
            if (!tbody) return;
            if (adminData.audit.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--sec-muted); padding: 24px;">No security audit events logged.</td></tr>`;
                return;
            }

            tbody.innerHTML = adminData.audit.slice(0, 50).map(a => `
                <tr>
                    <td style="font-size: 0.78rem; color: var(--sec-muted);">${new Date(a.timestamp).toLocaleString()}</td>
                    <td style="font-weight: 600; color: #38bdf8;">${a.operator}</td>
                    <td><span style="font-weight: 700; color: #fbbf24;">${a.event}</span></td>
                    <td>${a.desc}</td>
                    <td><span style="font-family: monospace; font-size: 0.72rem; color: var(--sec-muted);">${a.checksum}</span></td>
                </tr>
            `).join('');
        };

        // Single Key Ingestion (Cloud Firestore)
        window.submitSingleKey = async function() {
            const agent = document.getElementById('stockAgent').value;
            const model = document.getElementById('stockModel').value;
            const accuracy = document.getElementById('stockAccuracy').value;
            const usage = document.getElementById('stockUsage').value;
            const keyValue = document.getElementById('stockKeyValue').value.trim();

            if (!keyValue) return;

            const newKey = {
                id: 'key_' + Math.random().toString(36).substr(2, 9),
                agent: agent,
                model: model,
                accuracy: accuracy,
                usageLimit: usage,
                key: keyValue,
                status: 'available',
                addedAt: new Date().toISOString(),
                assignedTo: null
            };

            await saveVaultKeyToCloud(newKey);
            document.getElementById('stockKeyValue').value = '';
            logAuditEvent('KEY_INGEST', `Ingested single API key into Cloud Vault for ${agent}/${model}/L${accuracy}`);
            showSecToast("API Key successfully stored in Cloud Vault!");
        };

        // 1-Click Bulk Key Generator (Cloud Firestore)
        window.bulkGenerateKeys = async function(count) {
            const agent = document.getElementById('stockAgent').value;
            const model = document.getElementById('stockModel').value;
            const accuracy = document.getElementById('stockAccuracy').value;
            const usage = document.getElementById('stockUsage').value;

            for (let i = 0; i < count; i++) {
                const newKey = {
                    id: 'key_' + Math.random().toString(36).substr(2, 9),
                    agent: agent,
                    model: model,
                    accuracy: accuracy,
                    usageLimit: usage,
                    key: window.generate256CryptoKey(),
                    status: 'available',
                    addedAt: new Date().toISOString(),
                    assignedTo: null
                };
                await saveVaultKeyToCloud(newKey);
            }

            logAuditEvent('BULK_KEY_GENERATE', `Generated +${count} stock keys in Cloud Vault for ${agent}/${model}/L${accuracy}`);
            showSecToast(`Successfully added +${count} keys into Cloud Vault Pool!`);
        };

        window.deleteVaultKey = async function(id) {
            if (confirm("Are you sure you want to permanently delete this Key from cloud inventory?")) {
                await deleteVaultKeyFromCloud(id);
                logAuditEvent('KEY_DELETE', `Deleted cloud vault key ID: ${id}`);
                showSecToast("Key permanently deleted from Cloud Vault.", "fa-trash", "#ef4444");
            }
        };

        window.toggleKeyRevoke = async function(id) {
            const keyObj = adminData.vault.find(k => k.id === id);
            if (keyObj) {
                const newStatus = keyObj.status === 'revoked' ? 'available' : 'revoked';
                keyObj.status = newStatus;
                if (db && doc && setDoc) {
                    try {
                        await setDoc(doc(db, "inventory_vault", id), { status: newStatus }, { merge: true });
                    } catch(e) {}
                }
                logAuditEvent('KEY_STATUS_TOGGLE', `Toggled key ID ${id} status to ${newStatus}`);
                showSecToast(`Key status updated to ${newStatus.toUpperCase()} (Cloud Updated)`);
            }
        };

        window.toggleUserKeyStatus = async function(apiKey) {
            const k = adminData.userKeys.find(item => item.apiKey === apiKey);
            if (k) {
                k.status = (k.status === 'REVOKED' || k.status === 'revoked') ? 'ACTIVE' : 'REVOKED';
                
                // 1. Maintain dedicated shoora_revoked_keys list
                let revokedList = [];
                try {
                    revokedList = JSON.parse(localStorage.getItem('shoora_revoked_keys') || '[]');
                } catch(e) {}

                if (k.status === 'REVOKED') {
                    if (!revokedList.includes(apiKey)) revokedList.push(apiKey);
                } else {
                    revokedList = revokedList.filter(x => x !== apiKey);
                }
                localStorage.setItem('shoora_revoked_keys', JSON.stringify(revokedList));

                // 2. Cloud Firestore Real-Time Global Synchronization
                if (db && doc && setDoc) {
                    try {
                        await setDoc(doc(db, "platform_security", "suspensions"), {
                            revokedKeys: revokedList,
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                    } catch(e) {}

                    try {
                        if (k.orderId) {
                            await setDoc(doc(db, "orders", k.orderId), { status: k.status }, { merge: true });
                        }
                        if (k.uid && (k.keyId || k.id)) {
                            await setDoc(doc(db, "users", k.uid, "keys", (k.keyId || k.id)), { status: k.status }, { merge: true });
                        }
                    } catch(e) {}
                }

                renderUserKeysTable();
                logAuditEvent('USER_KEY_TOGGLE', `Toggled user key ${apiKey} to ${k.status}`);
                showSecToast(`Customer Key status set to ${k.status} (Cloud Policy Updated)`);
            }
        };

        window.toggleUserAccount = async function(email) {
            const cleanEmail = (email || '').toLowerCase().trim();
            const u = adminData.users.find(item => item.email.toLowerCase() === cleanEmail);
            if (u) {
                u.status = u.status === 'ACTIVE' ? 'SUSPENDED' : 'ACTIVE';
                
                // 1. Maintain dedicated shoora_suspended_users registry
                let suspendedList = [];
                try {
                    suspendedList = JSON.parse(localStorage.getItem('shoora_suspended_users') || '[]');
                } catch(e) {}

                if (u.status === 'SUSPENDED') {
                    if (!suspendedList.includes(cleanEmail)) suspendedList.push(cleanEmail);
                } else {
                    suspendedList = suspendedList.filter(x => x !== cleanEmail);
                }
                localStorage.setItem('shoora_suspended_users', JSON.stringify(suspendedList));

                // 2. Cloud Firestore Real-Time Global Synchronization
                if (db && doc && setDoc) {
                    try {
                        await setDoc(doc(db, "platform_security", "suspensions"), {
                            suspendedEmails: suspendedList,
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                    } catch(err) {
                        console.warn("Cloud suspension doc sync notice:", err);
                    }

                    if (u.uid) {
                        try {
                            await setDoc(doc(db, "users", u.uid), { status: u.status }, { merge: true });
                        } catch(e) {}
                    }
                }

                // 3. Save user status in accounts cache
                localStorage.setItem('shoora_admin_users', JSON.stringify(adminData.users));

                renderAccountsTable();
                logAuditEvent('USER_ACCOUNT_TOGGLE', `Customer ${cleanEmail} status set to ${u.status}`);
                showSecToast(`User account set to ${u.status} (Cloud Policy Updated)`);
            }
        };

        window.copyToClip = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                showSecToast("Copied to Clipboard!", "fa-copy");
            });
        };

        window.clearAuditLogs = function() {
            if (confirm("Clear local security audit history?")) {
                adminData.audit = [];
                saveAudit();
                showSecToast("Audit log cleared.");
            }
        };

        window.setGatewayStatus = function(status) {
            adminData.settings.maintenance = (status === 'MAINTENANCE');
            localStorage.setItem('shoora_gateway_status', status);
            logAuditEvent('GATEWAY_CIRCUIT_BREAKER', `API Gateway status modified to ${status}`);
            showSecToast(`API Gateway set to ${status}`);
        };

        window.updatePasscode = function() {
            const curr = document.getElementById('currPassInput').value;
            const newP = document.getElementById('newPassInput').value;
            const saved = localStorage.getItem('shoora_admin_pass') || 'shoora2026admin';

            if (curr !== saved) {
                alert("Current Master Passcode is invalid!");
                return;
            }

            localStorage.setItem('shoora_admin_pass', newP);
            document.getElementById('currPassInput').value = '';
            document.getElementById('newPassInput').value = '';
            logAuditEvent('PASSCODE_ROTATION', 'Administrator Master Passcode rotated successfully');
            showSecToast("Master Security Passcode updated!");
        };

        window.exportLedgerCSV = function() {
            if (adminData.orders.length === 0) return alert("No orders to export.");
            let csv = "Timestamp,PaymentID,CustomerEmail,AmountINR,Agent,Model,Accuracy,APIKey\n";
            adminData.orders.forEach(o => {
                csv += `"${o.timestamp}","${o.paymentId}","${o.email}",${o.amount},"${o.agent}","${o.model}","${o.accuracy}","${o.apiKey}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `shoora_orders_ledger_${Date.now()}.csv`;
            a.click();
            logAuditEvent('LEDGER_EXPORT_CSV', 'Exported orders ledger as CSV');
        };

        window.refreshRealData = async function() {
            showSecToast("Syncing real records from Firestore...", "fa-sync");
            await window.loadAllData();
            showSecToast("All live data synchronized successfully!");
        };

        window.purgeLegacyDummyCache = async function() {
            if (confirm("Are you sure you want to clean up old dummy test records and keep only real customer accounts?")) {
                localStorage.removeItem('shoora_all_purchased_keys');
                localStorage.removeItem('shoora_all_orders');
                localStorage.removeItem('shoora_last_transaction');
                localStorage.removeItem('shoora_admin_vault');
                adminData.vault = [];
                await window.loadAllData();
                logAuditEvent('CACHE_PURGE', 'Purged legacy cached data and reset vault to 0');
                showSecToast("Legacy cache purged. Clean 0-state database loaded!", "fa-broom");
            }
        };

        window.clearVaultStockToZero = function() {
            if (confirm("Are you sure you want to remove ALL keys from the vault and reset stock to 0?")) {
                adminData.vault = [];
                saveVault();
                logAuditEvent('VAULT_WIPED', 'Admin wiped all inventory stock to 0');
                showSecToast("Vault inventory reset to 0 stock!", "fa-trash", "#ef4444");
            }
        };

        window.exportLedgerJSON = function() {
            const blob = new Blob([JSON.stringify(adminData.orders, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `shoora_orders_ledger_${Date.now()}.json`;
            a.click();
            logAuditEvent('LEDGER_EXPORT_JSON', 'Exported orders ledger as JSON');
        };
    </script>
</body>
</html>
